<style>
/* Layout: kerangka ponsel Android (lebar 480) dengan bilah navigasi bawah; mode Desktop = bilah samping ala Windows. */
:root{
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --bg:#eaf3ec;--surface:#ffffff;--surface2:#f3f8f4;--ink:#13261b;--muted:#5b7264;--line:#cfe0d4;
  --accent:#1f8a4c;--accent-ink:#ffffff;--accent2:#9fdcb4;--pat:rgba(31,138,76,.09);--hero1:#1f8a4c;--hero2:#0f5c31;
  --ok:#1a8a47;--warn:#b7791f;--bad:#c53030;--okbg:#e2f5ea;--warnbg:#fdf1dc;--badbg:#fde4e4;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 -2px 0 rgba(0,0,0,.04) inset,0 6px 16px -8px rgba(19,38,27,.25);
  --r:16px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1510;--surface:#14221a;--surface2:#1a2b21;--ink:#e3f1e7;--muted:#93ab9b;--line:#29402f;
  --accent:#47c27a;--accent-ink:#06150c;--accent2:#2f6e48;--pat:rgba(71,194,122,.08);--hero1:#17643a;--hero2:#0a2c18;
  --ok:#5bd38d;--warn:#f0b45a;--bad:#ff7b7b;--okbg:#143322;--warnbg:#3a2c12;--badbg:#3d1818;
  --shadow:0 1px 0 rgba(255,255,255,.06) inset,0 -2px 0 rgba(0,0,0,.35) inset,0 8px 18px -8px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1510;--surface:#14221a;--surface2:#1a2b21;--ink:#e3f1e7;--muted:#93ab9b;--line:#29402f;
  --accent:#47c27a;--accent-ink:#06150c;--accent2:#2f6e48;--pat:rgba(71,194,122,.08);--hero1:#17643a;--hero2:#0a2c18;
  --ok:#5bd38d;--warn:#f0b45a;--bad:#ff7b7b;--okbg:#143322;--warnbg:#3a2c12;--badbg:#3d1818;

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  background-image:repeating-linear-gradient(135deg,var(--pat) 0 1px,transparent 1px 14px),radial-gradient(var(--pat) 1.2px,transparent 1.4px);
  background-size:auto,22px 22px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hero2)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.money{font-family:var(--f-num);font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));position:relative}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:linear-gradient(120deg,var(--hero1),var(--hero2));color:#fff;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px;box-shadow:0 6px 16px -10px rgba(0,0,0,.6);overflow:hidden}
.top::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 92% -20%,rgba(255,255,255,.22) 0 60px,transparent 61px),radial-gradient(circle at 78% 140%,rgba(255,255,255,.12) 0 70px,transparent 71px);pointer-events:none}
.top h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;font-weight:500;opacity:.8;font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer;position:relative;z-index:1;flex:none}
.ib svg{width:20px;height:20px}
.ib .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#ffd166;box-shadow:0 0 0 2px var(--hero1)}
main{padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;min-width:0;position:relative}
.card.pat{background-image:linear-gradient(var(--surface),var(--surface)),repeating-linear-gradient(45deg,var(--pat) 0 2px,transparent 2px 8px)}
.card h2,.card h3{margin:0 0 8px;font-size:15px;font-weight:700;text-wrap:balance}
.card h3{font-size:13.5px}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700}
.hero{background:linear-gradient(140deg,var(--hero1),var(--hero2));color:#fff;border:0;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 2px,transparent 2px 12px);pointer-events:none}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.big{font-family:var(--f-num);font-size:28px;font-weight:600;letter-spacing:-.5px;line-height:1.1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{min-width:0}
.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;box-shadow:0 1px 0 rgba(255,255,255,.5) inset}
.stat b{display:block;font-family:var(--f-num);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11px;color:var(--muted)}
.hero .stat{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);box-shadow:none}
.hero .stat span{color:rgba(255,255,255,.75)}
.bar{height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.hero .bar{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px}
.hero .bar i{background:linear-gradient(90deg,#c9f2d8,#fff)}
.list{display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);min-width:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.item .t small{color:var(--muted);display:block;overflow-wrap:anywhere}
.item .v{text-align:right;font-family:var(--f-num);font-weight:600;white-space:nowrap}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--k1:#5cc48e;--k2:#7ea8ff;--k3:#f0c060;--k4:#f08c9e;--k5:#ad94f5;--k6:#5fd2d2;--k7:#f5a676;--k8:#a3c45a;--k9:#aab4c0}}
:root[data-theme="dark"]{--k1:#5cc48e;--k2:#7ea8ff;--k3:#f0c060;--k4:#f08c9e;--k5:#ad94f5;--k6:#5fd2d2;--k7:#f5a676;--k8:#a3c45a;--k9:#aab4c0}
.chart{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.chart.wide1{grid-template-columns:1fr}
.chart svg{width:100%;max-width:150px;height:auto;display:block;margin:0 auto}
.chart svg text{fill:var(--ink);font-family:var(--f-num)}
.legend{display:grid;gap:6px;min-width:0}
.legend div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-family:var(--f-num);font-size:12px;text-align:right;white-space:nowrap}.legend b small{color:var(--muted);font-weight:500;margin-left:4px}
.hbars{display:grid;gap:8px}.hbars .hb{display:grid;gap:3px}.hbars .hb .row{font-size:12.5px}.hbars .tr{height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}.hbars .tr i{display:block;height:100%;border-radius:99px}
.vbars{display:flex;align-items:flex-end;gap:4px;height:130px;padding-top:6px;border-bottom:1px solid var(--line)}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vbars i{width:100%;max-width:26px;border-radius:5px 5px 0 0;min-height:2px}
.vlabels{display:flex;gap:4px}.vlabels span{flex:1;text-align:center;font-size:9.5px;color:var(--muted);min-width:0;overflow:hidden}
.dayH{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px;display:flex;justify-content:space-between}
@media (max-width:420px){.chart{grid-template-columns:120px minmax(0,1fr)}.chart svg{max-width:120px}}

.nav button{padding:6px 2px 6px}.nav button svg{width:21px;height:21px}
#app{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.hfont .eyebrow,.hfont .hsmall,.hfont .marq{text-transform:none;letter-spacing:.2px}
.hfont .eyebrow{font-size:15px;font-weight:400;opacity:.95}.hfont .hsmall{font-size:14px}
.remind.dense .t{transition:opacity .35s}.remind.dense .t.fade{opacity:0}
.top .logo{width:34px;height:34px;flex:none;position:relative;z-index:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
/* Mode Desktop Windows */
:root[data-layout="desktop"] #app{max-width:1200px;padding-bottom:20px}
@media (min-width:900px){
  :root[data-layout="desktop"] .nav{display:none}
  :root[data-layout="desktop"] #app{display:grid;grid-template-columns:230px 1fr;gap:0}
  :root[data-layout="desktop"] .side{display:grid;align-content:start;gap:4px;position:sticky;top:0;height:100vh;overflow:auto;padding:16px 10px;background:var(--surface);border-right:1px solid var(--line)}
  :root[data-layout="desktop"] .side .brand{font-weight:800;font-size:16px;padding:6px 10px 14px}
  :root[data-layout="desktop"] .side button{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;border:0;background:none;cursor:pointer;text-align:left;font-weight:600;color:var(--muted)}
  :root[data-layout="desktop"] .side button svg{width:18px;height:18px}
  :root[data-layout="desktop"] .side button.on{background:var(--surface2);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  :root[data-layout="desktop"] main{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  :root[data-layout="desktop"] main>.wide{grid-column:1/-1}
  :root[data-layout="desktop"] .fab{right:28px;bottom:28px}
  :root[data-layout="desktop"] .tiles{grid-template-columns:repeat(6,1fr)}
  :root[data-layout="desktop"] .top{grid-column:2}
  :root[data-layout="desktop"] .card,:root[data-layout="desktop"] .btn{border-radius:8px}
}
@media (max-width:360px){.tiles{grid-template-columns:repeat(3,1fr)}.big{font-size:24px}}
/* Leaflet minimal */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;height:100%;font-family:var(--f-body)}
.leaflet-tile,.leaflet-marker-icon{user-select:none}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px}
.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-control{position:relative;z-index:800;pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control-zoom{margin:10px;display:grid;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.leaflet-control-zoom a{width:32px;height:32px;display:grid;place-items:center;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.75);color:#333;padding:0 4px}
.leaflet-control-attribution a{color:#235}
.leaflet-interactive{cursor:pointer}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s}
</style>

// ---------- Penyimpanan (IndexedDB, cadangan localStorage) ----------
const DBN='rgmc-kas-target',ST='kv';
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function kvGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const q=db.transaction(ST).objectStore(ST).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){try{const v=localStorage.getItem(DBN+k);return v?JSON.parse(v):undefined}catch(_){return undefined}}}
async function kvSet(k,v){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction(ST,'readwrite');t.objectStore(ST).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){try{localStorage.setItem(DBN+k,JSON.stringify(v))}catch(_){}}}
async function kvDel(k){try{const db=await idb();db.transaction(ST,'readwrite').objectStore(ST).delete(k)}catch(e){}}

// ---------- Format Rupiah ----------
function money(v,opt={}){
  v=Math.round(+v||0);const neg=v<0;v=Math.abs(v);const f=opt.fmt||S.settings.fmt;let s;
  const id=n=>n.toLocaleString('id-ID',{maximumFractionDigits:3});
  if(f==='penuh')s=id(v);
  else if(f==='ringkas'){s=v>=1e9?id(+(v/1e9).toFixed(2))+' M':v>=1e6?id(+(v/1e6).toFixed(2))+' jt':v>=1e3?id(+(v/1e3).toFixed(1))+' rb':id(v)}
  else s=id(v/1000);
  return (neg?'-':'')+(S.settings.showRp&&!opt.noRp?'Rp':'')+s;
}
// nilai yang diketik di kolom uang -> rupiah
const unitMul=()=>S.settings.inputRibuan?1000:1;
function parseMoney(str){str=String(str||'').trim().replace(/rp/i,'').replace(/\s/g,'');if(!str)return 0;str=str.replace(/\./g,'').replace(',','.');const n=parseFloat(str);return isNaN(n)?0:Math.round(n*unitMul())}
function moneyInputVal(v){if(!v)return '';const n=v/unitMul();return n.toLocaleString('id-ID',{maximumFractionDigits:3})}
const unitHint=()=>S.settings.inputRibuan?'ketik dalam ribuan · 1.000 = Rp1.000.000':'ketik rupiah penuh';

// ---------- Periode target ----------
function periodOf(ref=new Date()){
  const td=S.settings.targetDay;const y=ref.getFullYear(),m=ref.getMonth();
  const clamp=(yy,mm)=>Math.min(td,new Date(yy,mm+1,0).getDate());
  let end=new Date(y,m,clamp(y,m),23,59,59);
  if(ref>end)end=new Date(y,m+1,clamp(y,m+1),23,59,59);
  const pm=new Date(end.getFullYear(),end.getMonth()-1,1);
  const start=new Date(pm.getFullYear(),pm.getMonth(),clamp(pm.getFullYear(),pm.getMonth())+1,0,0,0);
  return{start,end,key:end.getFullYear()+'-'+String(end.getMonth()+1).padStart(2,'0')};
}
function dueDateOf(ob,p){const e=p.end;if(!ob.day)return new Date(e.getFullYear(),e.getMonth(),e.getDate());
  // tanggal jatuh tempo di dalam periode
  const cand=[new Date(e.getFullYear(),e.getMonth(),ob.day),new Date(e.getFullYear(),e.getMonth()-1,ob.day)];
  return cand.find(d=>d>=new Date(p.start.getFullYear(),p.start.getMonth(),p.start.getDate())&&d<=e)||cand[0];}
const inP=(s,p)=>{const d=parseD(s);return d&&d>=p.start&&d<=p.end};

// ---------- Mesin hitung (replay semua transaksi) ----------
function compute(){
  const R={pulsaFund:0,modal:{},modalIn:0,stock:{},kas:{laba:0,lain:0},wallet:{tunai:0,digital:0,ewallet:0},titipan:0,profitAll:0,
    bons:{},obPaid:{},p:periodOf(),pProfit:0,pOther:0,pPaidFromKas:0,pSpentOther:0,daily:{}};
  S.cats.forEach(c=>R.modal[c.id]=0);
  const P=R.p;
  const addModal=(cat,v)=>{if(!cat)return;R.modal[cat]=(R.modal[cat]||0)+v};
  const addKas=(v,bucket,wallet,date,isProfit)=>{R.kas[bucket]+=v;wallet=wallet&&wallet!=='utang'?wallet:'tunai';R.wallet[wallet]=(R.wallet[wallet]||0)+v;
    if(isProfit){R.profitAll+=v;if(inP(date,P)){R.pProfit+=v;const k=String(date).slice(0,10);R.daily[k]=(R.daily[k]||0)+v}}
    else if(v>0&&bucket==='lain'&&inP(date,P)){R.pOther+=v;if(S.settings.targetMode==='laba_lain'){const k=String(date).slice(0,10);R.daily[k]=(R.daily[k]||0)+v}}};
  const spend=(v,src,cat,wallet,date)=>{ // sumber dana: laba | kas | modal
    if(src==='modal')addModal(cat,-v);
    else{R.kas[src==='laba'?'laba':'lain']-=v;R.wallet[wallet||'tunai']=(R.wallet[wallet||'tunai']||0)-v}};
  const stk=(name)=>R.stock[name]||(R.stock[name]={qty:0,val:0,cat:null});
  const bonOf=n=>R.bons[n]||(R.bons[n]={items:[],pays:[],total:0,paid:0});
  const tx=[...S.tx].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  // ambil modal dari stok (rata-rata)
  const takeStock=(name,qty)=>{const s=stk(name);const unit=s.qty>0?s.val/s.qty:0;const c=Math.round(unit*qty);s.qty-=qty;s.val-=c;return c};
  for(const t of tx){
    if(t.type==='pulsa'&&t.ok===false)continue;
    const a=+t.amount||0;
    switch(t.type){
      case 'modal_in':addModal(t.cat,a);R.modalIn+=a;if(t.from==='kas')spend(a,'kas',null,t.wallet,t.date);if(t.from==='laba')spend(a,'laba',null,t.wallet,t.date);break;
      case 'beli':{addModal(t.cat,-a);const s=stk(t.product);s.qty+=(+t.qty||1);s.val+=a;s.cat=t.cat;break}
      case 'sale':{if(t.ok===false)break;let cost=+t.cost||0;const price=+t.price||0;const src=t.src||'';let retCat=t.retCat||null,retW=null;
        if(src==='stok'&&t.product){const c=takeStock(t.product,+t.qty||1);if(!t.cost)cost=c;retCat=stk(t.product).cat||retCat}
        else if(src.startsWith('cat:')){retCat=src.slice(4);addModal(retCat,-cost)}
        else if(src==='pulsa'){R.pulsaFund-=cost;retCat=retCat||'c4'}
        else if(src.startsWith('w:')){retW=src.slice(2);R.wallet[retW]=(R.wallet[retW]||0)-cost}
        t._cost=cost;
        if(t.wallet==='utang'){const b=bonOf(t.buyer||'Tanpa nama');b.items.push({t,price,cost,cat:retCat,retW:!!retW,left:price});b.total+=price}
        else{const w=t.wallet||'tunai';if(retW)R.wallet[w]=(R.wallet[w]||0)+cost;else addModal(retCat,cost);addKas(price-cost,'laba',w,t.date,true)}
        break}
      case 'isi_pulsa':{R.pulsaFund+=a;if(t.source==='modal')addModal(t.cat,-a);else if(t.source)spend(a,t.source,null,t.wallet,t.date);break}
      case 'pulsa':{const cost=+t.cost||0;const price=+t.price||0;R.pulsaFund-=cost;t._cost=cost;
        if(t.utang){const b=bonOf(t.buyer||'Tanpa nama');b.items.push({t,price,cost,cat:t.cat,left:price});b.total+=price}
        else{addModal(t.cat,cost);addKas(price-cost,'laba',t.wallet,t.date,true)}break}
      case 'trf_out':{R.wallet.digital-=a;R.wallet.tunai+=a;const fee=+t.fee||0;if(fee)addKas(fee,'laba',t.wallet||'tunai',t.date,true);break}
      case 'jual':{
        const qty=+t.qty||1;let cost=+t.cost||0;
        if(t.fromStock&&t.product){const c=takeStock(t.product,qty);if(!t.cost)cost=c;addModal(stk(t.product).cat||t.cat,cost)}
        // dari modal langsung: keluar lalu kembali (bersih 0)
        const profit=(+t.price||0)-cost;t._cost=cost;
        if(t.utang){ // masuk piutang
          const b=bonOf(t.buyer||'Tanpa nama');if(!t.fromStock)addModal(t.cat,-cost);else addModal(stk(t.product).cat||t.cat,-cost);
          b.items.push({t,price:+t.price||0,cost,cat:t.fromStock?(stk(t.product).cat||t.cat):t.cat,left:+t.price||0});b.total+=(+t.price||0);
        } else addKas(profit,'laba',t.wallet,t.date,true);
        break}
      case 'bon':{const b=bonOf(t.person||'Tanpa nama');const qty=+t.qty||1;let cost=+t.cost||0;let cat=t.cat;
        if(t.fromStock&&t.product){const c=takeStock(t.product,qty);if(!t.cost)cost=c;cat=stk(t.product).cat||t.cat}else addModal(cat,-cost);
        t._cost=cost;b.items.push({t,price:+t.price||0,cost,cat,left:+t.price||0});b.total+=(+t.price||0);break}
      case 'pinjam':{const b=bonOf(t.person||'Tanpa nama');spend(a,t.source||'kas',t.cat,t.wallet,t.date);
        b.items.push({t,price:a,cost:a,cat:t.source==='modal'?t.cat:null,left:a,loan:true,src:t.source});b.total+=a;break}
      case 'bon_bayar':{const b=bonOf(t.person||'Tanpa nama');let rest=a;b.paid+=a;b.pays.push(t);
        for(const it of b.items){if(rest<=0)break;if(it.left<=0)continue;const part=Math.min(rest,it.left);it.left-=part;rest-=part;
          const costPart=it.price?Math.round(part*it.cost/it.price):0;const prof=part-costPart;
          if(it.loan){if(it.src==='modal')addModal(it.cat,part);else addKas(part,'lain',t.wallet,null,false)}
          else{if(it.retW)R.wallet[t.wallet||'tunai']=(R.wallet[t.wallet||'tunai']||0)+costPart;else addModal(it.cat,costPart);addKas(prof,'laba',t.wallet,t.date,true)}}
        if(rest>0)addKas(rest,'lain',t.wallet,t.date,false);break}
      case 'bayar':{spend(a,t.source||'laba',t.cat,t.wallet,t.date);if(inP(t.date,P)){R.obPaid[t.obId]=(R.obPaid[t.obId]||0)+a;if(t.source==='laba'||(t.source==='kas'&&S.settings.targetMode==='laba_lain'))R.pPaidFromKas+=a}break}
      case 'keluar':{spend(a,t.source||'kas',t.cat,t.wallet,t.date);
        if(String(t.kind).startsWith('ob:')&&inP(t.date,P)){const oid=t.kind.slice(3);R.obPaid[oid]=(R.obPaid[oid]||0)+a;if(t.source==='laba'||(t.source==='kas'&&S.settings.targetMode==='laba_lain'))R.pPaidFromKas+=a}
        if(t.kind==='pulsa')R.pulsaFund+=a;if(t.kind==='modal'&&t.product){const s=stk(t.product);s.qty+=(+t.qty||1);s.val+=a;s.cat=t.cat}
        if(t.source!=='modal'&&inP(t.date,P))R.pSpentOther+=a;break}
      case 'masuk':addKas(a,'lain',t.wallet,t.date,false);break;
      case 'mutasi':R.wallet[t.from]-=a;R.wallet[t.to]+=a;break;
      case 'trf':{R.wallet.digital+=a;R.titipan+=a;const fee=+t.fee||0;if(fee)addKas(fee,'laba','tunai',t.date,true);
        if(t.taken){R.wallet.tunai-=a;R.titipan-=a}break}
    }
  }
  // Kredit HP
  R.credits={};
  for(const c of S.credits){
    const price=+c.price||0,cost=+c.cost||0;
    if(c.fromStock&&c.product){const s=R.stock[c.product];if(s&&s.qty>0){const unit=s.val/s.qty;s.qty-=1;s.val-=unit}}else addModal(c.cat,-cost);
    const pays=[{date:c.date,amount:+c.dp||0,dp:true},...(c.payments||[])];let paid=0;
    for(const p of pays){const v=+p.amount||0;if(!v)continue;paid+=v;const cp=price?Math.round(v*cost/price):0;addModal(c.cat,cp);addKas(v-cp,'laba',p.wallet,p.date,true)}
    R.credits[c.id]={paid,left:Math.max(0,price-paid),price};
  }
  Object.values(R.bons).forEach(b=>b.left=b.items.reduce((s,i)=>s+i.left,0));
  R.modalCash=Object.values(R.modal).reduce((s,v)=>s+v,0)+R.pulsaFund;
  R.modalFisik=Object.values(R.stock).reduce((s,v)=>s+Math.max(0,v.val),0);
  R.bonTotal=Object.values(R.bons).reduce((s,b)=>s+b.left,0);
  R.kreditTotal=Object.values(R.credits).reduce((s,c)=>s+c.left,0);
  R.kasTotal=R.kas.laba+R.kas.lain;
  // Target
  R.obTotal=S.obligations.reduce((s,o)=>s+(+o.amount||0),0);
  R.obPaidTotal=S.obligations.reduce((s,o)=>s+Math.min(+o.amount||0,R.obPaid[o.id]||0),0);
  R.obLeft=R.obTotal-R.obPaidTotal;
  R.collected=R.pProfit+(S.settings.targetMode==='laba_lain'?R.pOther:0);
  R.available=Math.max(0,R.collected-R.pPaidFromKas);
  R.shortfall=Math.max(0,R.obLeft-R.available);
  const now=new Date();R.daysLeft=Math.max(1,dayDiff(P.end,now)+1);
  R.perDay=Math.ceil(R.shortfall/R.daysLeft/1000)*1000;R.perWeek=Math.min(Math.ceil(R.shortfall/1000)*1000,R.perDay*7);
  R.totalDays=dayDiff(P.end,P.start)+1;
  R.pct=R.obTotal?Math.min(100,Math.round((R.obPaidTotal+Math.min(R.available,R.obLeft))/R.obTotal*100)):0;
  return R;
}

// ---------- Pengingat ----------
function buildAlerts(R){
  const A=[];const now=new Date();const rd=+S.settings.remindDays||3;const P=R.p;
  for(const o of S.obligations){const left=(+o.amount||0)-(R.obPaid[o.id]||0);if(left<=0)continue;
    const due=dueDateOf(o,P);const dd=dayDiff(due,now);
    if(dd<0)A.push({c:'kewajiban',k:'ob'+o.id+P.key,lvl:'bad',title:`${o.name} lewat jatuh tempo`,text:`Sisa ${money(left)} · jatuh tempo ${due.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}`,go:'target'});
    else if(dd<=rd)A.push({c:'kewajiban',k:'ob'+o.id+P.key+dd,lvl:dd===0?'bad':'warn',title:dd===0?`${o.name} jatuh tempo hari ini`:`${o.name} jatuh tempo ${dd} hari lagi`,text:`Sisa ${money(left)}${o.day?' · tgl '+o.day:' · paling lambat tgl '+S.settings.targetDay}`,go:'target'});
  }
  for(const c of S.credits){if(c.active===false)continue;const st=R.credits[c.id];if(!st||st.left<=0)continue;const nd=creditNextDue(c,st);if(!nd)continue;
    const dd=dayDiff(nd.date,now);if(dd<=rd)A.push({c:'kredit',k:'kr'+c.id+nd.date.toDateString(),lvl:dd<=0?'bad':'warn',title:`${ctName(c)}: ${c.name}`,text:`${dd<0?'Terlambat '+(-dd)+' hari':dd===0?'Jatuh tempo hari ini':dd+' hari lagi'} · ${nd.label} ${money(nd.amount)}`,go:'kredit',id:c.id,phones:c.phones});}
  for(const t of S.tx){if(t.type!=='bon'||!t.due)continue;const b=R.bons[t.person];if(!b||b.left<=0)continue;const dd=dayDiff(parseD(t.due),now);
    if(dd<=rd)A.push({c:'bon',k:'bn'+t.id+t.due,lvl:dd<=0?'bad':'warn',title:`${L('bon')}: ${t.person}`,text:`Janji bayar ${fmtDate(t.due)} · sisa ${money(b.left)}`,go:'piutang'})}
  for(const n of S.notes){if(n.kind!=='line')continue;for(const l of n.lines||[]){if(!l.at||l.done)continue;const d=parseD(l.at);if(d<=now&&now-d<864e5)A.push({c:'catatan',k:'nt'+l.id+l.at,lvl:'warn',title:`Catatan: ${n.title||'Tanpa judul'} · ${d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}`,text:l.text||'(baris kosong)',go:'notes',vib:l.vib,msg:l.msg,exact:true})}}
  for(const t of S.tx){if(t.type!=='trf'||t.taken)continue;const dd=dayDiff(now,parseD(t.date)||now);A.push({c:'transfer',k:'tf'+t.id,lvl:dd>=1?'warn':'info',title:`Titipan belum diambil: ${t.receiver||'penerima'}`,text:`${money(t.amount)} · masuk ${fmtDate(t.date)}${t.account?' · '+t.account:''}`,go:'digital'})}
  // sholat berikutnya yang diaktifkan
  try{const l=S.settings.loc;const pt=prayerTimes(now,l.lat,l.lng,-now.getTimezoneOffset()/60);const nh=now.getHours()+now.getMinutes()/60;
   const nx=['subuh','dzuhur','ashar','maghrib','isya'].find(k=>S.settings.prayerAlarm[k]&&pt[k]>nh);
   if(nx){const mins=Math.round((pt[nx]-nh)*60);A.push({c:'sholat',k:'ps'+nx,lvl:'info',title:`Sholat ${nx[0].toUpperCase()+nx.slice(1)} ${hm(pt[nx])}`,text:mins>=60?`${Math.floor(mins/60)} jam ${mins%60} menit lagi`:`${mins} menit lagi`,go:'sholat',passive:true})}}catch(e){}
  // catatan bergaris yang akan datang hari ini
  for(const n of S.notes){if(n.kind!=='line')continue;for(const l of n.lines||[]){if(!l.at||l.done)continue;const d=parseD(l.at);if(d>now&&d.toDateString()===now.toDateString())A.push({c:'catatan',k:'nu'+l.id,lvl:'info',title:`${l.text||'Catatan'} · ${d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}`,text:n.title||'Catatan bergaris',go:'notes',passive:true})}}
  // hanya kategori yang aktif di pengaturan pengingat
  const NC=S.settings.notifCat||{};const on=c=>{const x=NC[c];return !x||Object.values(x).some(Boolean)};
  return A.filter(a=>on(a.c));
}
function creditNextDue(c,st){
  if(c.type===2){const d=parseD(c.nextPay);return d?{date:d,amount:st.left,label:'Bayar'}:null}
  const per=+c.perMonth||0;if(!per)return null;const paidInst=Math.max(0,st.paid-(+c.dp||0));const done=Math.floor(paidInst/per);
  if(done>=(+c.months||0))return null;const f=parseD(c.firstDue)||parseD(c.date);if(!f)return null;
  const d=new Date(f.getFullYear(),f.getMonth()+done,f.getDate());return{date:d,amount:Math.min(per,st.left),label:'Angsuran ke-'+(done+1)};
}

function checkReminders(){
  const R=compute();const A=buildAlerts(R);$('#alertDot').hidden=!A.length;
  const now=new Date();const hm=now.toTimeString().slice(0,5);
  const slots=String(S.settings.remindTimes||'').split(/[,;\s]+/).filter(x=>/^\d{1,2}:\d{2}$/.test(x)).map(x=>x.padStart(5,'0'));
  const dayKey=todayISO();
  for(const a of A){if(a.passive)continue;const key=a.exact?a.k:a.k+dayKey+(slots.find(s=>s<=hm)||'');
    const due=a.exact||slots.some(s=>s<=hm);if(due&&!S.fired[key]){S.fired[key]=1;fireAlert(a);save()}}
  checkPrayer(now);
}

function readPhoto(file,max=640){return new Promise(res=>{if(!file)return res('');const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.onerror=()=>res('');img.src=fr.result};fr.readAsDataURL(file)})}

let ADZ={ctx:null,nodes:[],audio:null};
function stopAdzan(){try{ADZ.nodes.forEach(n=>n.stop&&n.stop())}catch(e){}ADZ.nodes=[];if(ADZ.audio){ADZ.audio.pause();ADZ.audio=null}}
function melodyAdzan(){try{stopAdzan();const c=ADZ.ctx=ADZ.ctx||new (window.AudioContext||window.webkitAudioContext)();
  const notes=[[440,1.6],[494,.6],[523,1.2],[494,.6],[440,2.2],[0,.5],[392,.8],[440,.8],[494,1.4],[440,.6],[392,.6],[349,2.4],[0,.5],[440,1.2],[523,.8],[587,1.8],[523,.6],[494,.6],[440,2.8]];
  let t=c.currentTime+.05;for(const[f,d]of notes){if(f){const o=c.createOscillator(),g=c.createGain(),v=c.createOscillator(),vg=c.createGain();o.type='sine';o.frequency.value=f;v.frequency.value=5;vg.gain.value=4;v.connect(vg).connect(o.frequency);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.12);g.gain.setValueAtTime(.22,t+d-.2);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);v.start(t);o.stop(t+d+.05);v.stop(t+d+.05);ADZ.nodes.push(o,v)}t+=d}}catch(e){}}

  if(mode==='file'){const b=await kvGet(key);if(b instanceof Blob){stopAdzan();ADZ.audio=new Audio(URL.createObjectURL(b));ADZ.audio.play().catch(()=>melodyAdzan());return}}
  melodyAdzan()}

function resolvePcat(v){if(v.pcat!=='__new'){delete v.newPcat;return true}const n=(v.newPcat||'').trim();if(!n){toast('Isi nama kategori baru');return false}
  let c=S.pcats.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!c){c={id:uid(),name:n,kind:'barang'};S.pcats.push(c)}v.pcat=c.id;delete v.newPcat;return true}
function saveSale(v,id){if(!resolvePcat(v))return false;
  const trf=isTrf(v);if(trf&&!v.product)v.product='Transfer uang';
  if(!v.product){toast('Isi nama produk');return false}
  if(trf){if(!v.tamount){toast('Isi jumlah ditransfer');return false}v.qty=1;v.cost=v.tamount;v.price=v.tamount+(v.fee||0)}
  else{v.qty=v.qty||1;if(!v.uprice){toast('Isi harga jual');return false}v.cost=Math.round((v.ucost||0)*v.qty);v.price=Math.round(v.uprice*v.qty);if(v.src==='stok'&&!v.ucost)delete v.cost}
  if(v.wallet==='utang'&&!v.buyer){toast('Nama pembeli wajib jika berhutang');return false}
  if(v.src==='pulsa'&&!v.retCat)v.retCat='c4';
  let p=findProd(v.product);
  if(!p){p={id:uid(),name:v.product,pcat:v.pcat,price:trf?0:v.uprice,cost:trf?0:v.ucost,src:v.src};S.products.push(p)}
  else{if(!p.pcat)p.pcat=v.pcat;if(!trf){if(!p.price)p.price=v.uprice;if(!p.cost&&v.ucost)p.cost=v.ucost}if(!p.src)p.src=v.src}
  if(!v.date)v.date=nowLocal();
  if(id){const i=S.tx.findIndex(x=>x.id===id);S.tx[i]={...S.tx[i],...v,type:'sale'}}else S.tx.push({id:uid(),type:'sale',...v});
  save();closeSheet();toast(id?'Perubahan disimpan':v.wallet==='utang'?'Penjualan dicatat · masuk piutang '+v.buyer:'Penjualan dicatat');render();return true}
function saveTx(){
  const {type,id}=FORM;const v=readForm(FORM.fields);
  for(const f of FORM.fields){const w=document.querySelector(`[data-fk="${f.k}"]`);if(w&&w.hidden&&f.k!=='date')delete v[f.k]}
  if(type==='sale'){saveSale(v,id);return}
  let realType=type;if(type==='keluar'&&v.kind==='piutang'){realType='pinjam'}
  if(type==='masuk'&&v.kind==='kredit'){const c=S.credits.find(x=>x.id===v.credit);if(!c){toast('Pilih pelanggan kredit');return}if(!v.amount){toast('Isi jumlah');return}
    c.payments=c.payments||[];c.payments.push({id:uid(),label:v.label||'Pembayaran',amount:v.amount,wallet:v.wallet,date:v.date||nowLocal(),note:v.desc||'',photo:v.photo||''});save();closeSheet();render();toast('Pembayaran kredit dicatat');struk(c);return}
  if(type==='masuk'&&v.kind==='bon'){realType='bon_bayar'}
  if(type==='masuk'&&v.kind==='modal'){realType='modal_in'}
  if(type==='keluar'&&v.kind==='modal')v.source='modal';
  const need={jual:['price'],beli:['amount'],bayar:['amount'],keluar:['amount'],masuk:['amount'],modal_in:['amount'],bon:['price','person'],bon_bayar:['amount','person'],pinjam:['amount','person'],trf:['amount'],pulsa:['price'],mutasi:['amount'],trf_out:['amount'],isi_pulsa:['amount']}[realType]||[];
  for(const k of need)if(!v[k]){toast('Lengkapi: '+(FORM.fields.find(f=>f.k===k)||{l:k}).l);return}
  if((realType==='jual'||realType==='pulsa')&&v.utang&&!v.buyer){toast('Nama pembeli wajib untuk transaksi utang');return}
  if(!v.date)v.date=nowLocal();
  // tambah modal langsung
  if(v.addModal&&v.cat){S.tx.push({id:uid(),type:'modal_in',cat:v.cat,amount:v.addModal,from:'luar',date:v.date,desc:'Penambahan modal untuk transaksi: '+(v.product||v.desc||TX[type].n)})}
  delete v.addModal;
  if(v.product&&!S.products.find(p=>p.name.toLowerCase()===v.product.toLowerCase()))S.products.push({id:uid(),name:v.product,cat:v.cat||null});
  if(id){const i=S.tx.findIndex(x=>x.id===id);S.tx[i]={...S.tx[i],...v,type:realType}}else S.tx.push({id:uid(),type:realType,...v});
  save();closeSheet();toast(id?'Perubahan disimpan':'Transaksi dicatat');render();
}

const TOOLS=[['notes','catatan','note'],['rekam','Rekam Suara','mic'],['kalkulator','Kalkulator','calc'],['sholat','Jadwal Sholat','moon'],['peta','Peta & Jarak','map'],['fmd','Find My Device','search'],['unduh','Downloader','down'],['transfer','Transfer File','swap']];
const MENU=[['tm','Target & Modal','target'],['bon','bon','user'],['kredit','kredit','phone'],['digital','digital','digital'],['notes','catatan','note'],['rekam','Rekam Suara','mic'],['kalkulator','Kalkulator','calc'],
  ['sholat','Jadwal Sholat','moon'],['peta','Peta & Jarak','map'],['fmd','Find My Device','search'],['unduh','Downloader','down'],['transfer','Transfer File','swap'],['alerts','Pengingat','bell'],['settings','Pengaturan','gear']];
const ALIAS={target:['tm'],modal:['tm'],piutang:['db','piutang'],bon:['db','piutang'],kredit:['db','kredit'],digital:['db','titipan'],bayar:['db','hasil'],hasil:['db','hasil'],gudang:['db','target'],tx:['home'],menu:['home'],alerts:['settings','pengingat']};
const titleOf=v=>({hasil:'Data Hasil',gudang:'Data Gudang',home:'Beranda',tm:'Diagram & Transaksi',bayar:'Database',db:'Database',notes:L('catatan'),rekam:'Rekam Suara',kalkulator:'Kalkulator',sholat:'Jadwal Sholat & Kiblat',peta:'Peta, Lokasi & Jarak',fmd:'Find My Device',unduh:'Downloader',transfer:'Transfer File',settings:'Pengaturan',person:'Rincian Piutang',kreditDetail:'Rincian Kredit',noteEdit:'Catatan'})[v]||v;
function go(v,push=true){if(v==='add'){quickAdd();return}if(v.includes('#')){const[x,y]=v.split('#');SUB.setFocus=y;v=x}const al=ALIAS[v];if(al){v=al[0];if(al[1]){if(v==='tm')SUB.tmTab=al[1];if(v==='db'){if(al[1]==='hasil')SUB.dbTab='hasil';else{SUB.dbTab='gudang';SUB.gdTab=al[1]}}if(v==='settings')SUB.setFocus=al[1]}}
  if(push&&VIEW!==v)STACK.push(VIEW);VIEW=v;window.scrollTo(0,0);render();
  if(SUB.setFocus&&v==='settings'){const el=document.getElementById('sec-'+SUB.setFocus);SUB.setFocus='';el&&el.scrollIntoView({block:'start'})}}
function render(){
  const R=compute();
  document.documentElement.dataset.style=S.settings.style;document.documentElement.dataset.layout=S.settings.layout;
  if(S.settings.mode==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=S.settings.mode;
  $('#ttl').textContent=titleOf(VIEW);$('#backBtn').hidden=!STACK.length||NAV.some(n=>n[0]===VIEW);
  $('#nav').innerHTML=NAV.map(([k,l,i])=>k==='add'?`<button class="add" data-act="quickAdd" aria-label="Catat transaksi"><span>${ic('plus')}</span>${l}</button>`:`<button class="${VIEW===k?'on':''}" data-act="nav" data-v="${k}">${ic(i)}<span>${l}</span></button>`).join('');
  $('#side').innerHTML=`<div class="brand">Rgm Gocell</div><button class="btn pri" data-act="quickAdd" style="margin-bottom:8px;justify-content:center">${ic('plus')} Catat transaksi</button>`+[['home','Beranda','home'],['tm','Diagram & Transaksi','chart'],['hasil','Data Hasil','list'],['gudang','Data Gudang','db'],...TOOLS,['alerts','Pengingat','bell'],['settings','Pengaturan','gear']].map(([k,l,i])=>[k,L(l)===l?l:L(l),i]).map(([k,l,i])=>`<button class="${VIEW===k||(VIEW==='db'&&((k==='hasil'&&SUB.dbTab==='hasil')||(k==='gudang'&&SUB.dbTab!=='hasil')))?'on':''}" data-act="nav" data-v="${k}">${ic(i)}<span>${esc(l)}</span></button>`).join('');
  $('#fab').hidden=true;
  $('#alertDot').hidden=!buildAlerts(R).length;
  const fn=VIEWS[VIEW]||VIEWS.home;$('#main').innerHTML=fn(R);
  if(AFTER[VIEW])AFTER[VIEW](R);
  enhanceScroll();
}
const AFTER={};
const VIEWS={};
function locLine(){const l=S.settings.loc;const parts=[l.desa&&'Desa/Kel. '+l.desa,l.kec&&'Kec. '+l.kec,l.kab&&(/kota/i.test(l.kab)?l.kab:'Kab. '+l.kab)].filter(Boolean);return parts.length?parts.join(' · '):(l.name||'')}
VIEWS.home=R=>{const H=S.settings.homeShow;const A=buildAlerts(R);const l=S.settings.loc;
  const now=new Date();const pt=prayerTimes(now,l.lat,l.lng,-now.getTimezoneOffset()/60);const nh=now.getHours()+now.getMinutes()/60;
  const PN=[['subuh','Subuh'],['dzuhur','Dzuhur'],['ashar','Ashar'],['maghrib','Maghrib'],['isya','Isya']];const nx=(PN.find(([k])=>pt[k]>nh)||PN[0])[0];
  let o='';
  const DN=S.settings.dense||{};
  if((H.lokasi||H.sholat)&&DN.sholat)o+=`<section class="card locmini wide">${H.lokasi?`<div class="lr" role="button" tabindex="0" data-act="nav" data-v="sholat">${ic('map')}<span>${esc(locLine()||'Lokasi belum diketahui · '+l.lat.toFixed(3)+', '+l.lng.toFixed(3))}</span><button data-act="locRefresh">Perbarui</button></div>`:''}${H.sholat?`<div class="pt-mini" role="button" tabindex="0" data-act="nav" data-v="sholat">${PN.map(([k,n])=>`<div class="${k===nx?'on':''}"><span>${n}</span><b>${hm(pt[k])}</b></div>`).join('')}</div>`:''}</section>`;
  else if(H.lokasi||H.sholat)o+=`<section class="card locsh wide">${H.lokasi?`<div class="locrow" role="button" tabindex="0" data-act="nav" data-v="sholat">${ic('map')}<div class="t"><b>${esc(locLine()||'Lokasi belum diketahui')}</b><small class="money">${l.lat.toFixed(4)}, ${l.lng.toFixed(4)}</small></div><button class="btn sm" data-act="locRefresh">Perbarui</button></div>`:''}
   ${H.sholat?`<div class="ptimes" role="button" tabindex="0" data-act="nav" data-v="sholat">${PN.map(([k,n])=>`<div class="${k===nx?'on':''}"><span>${n}</span><b>${hm(pt[k])}</b></div>`).join('')}</div>`:''}</section>`;
  if(H.target)o+=heroCard(R);
  if(H.pengingat&&A.length&&DN.pengingat)o+=`<section class="card remind dense wide ${A.some(a=>a.lvl==='bad')?'bad':''}" role="button" tabindex="0" data-act="go" data-v="alerts">${ic('bell','style="width:16px;height:16px;flex:none;color:var(--warn)"')}<span class="pill ${A.some(a=>a.lvl==='bad')?'bad':'warn'}">${A.length}</span><span class="t" id="remRot" data-i="0">${esc(A[0].title)}${A[0].text?' · '+esc(A[0].text):''}</span><span class="mut">›</span></section>`;
  else if(H.pengingat&&A.length)o+=`<section class="card remind wide ${A.some(a=>a.lvl==='bad')?'bad':''}"><div class="row"><b class="sp">${ic('bell','style="width:16px;height:16px;vertical-align:-3px"')} Pengingat (${A.length})</b><button class="btn sm" data-act="go" data-v="alerts">Semua</button></div>${A.slice(0,2).map(a=>`<div class="rline" role="button" tabindex="0" data-act="go" data-v="${a.go}"><span class="pill ${a.lvl==='bad'?'bad':'warn'}">${a.lvl==='bad'?'Segera':'Ingat'}</span><span class="t">${esc(a.title)}</span></div>`).join('')}</section>`;
  o+=`<section class="card wide"><div class="tiles compact">${TOOLS.map(([k,lb,i])=>`<button class="tile" data-act="nav" data-v="${k}"><i>${ic(i)}</i>${esc(L(lb))}</button>`).join('')}</div></section>`;
  if(H.saldo)o+=`<section class="card pat wide"><h2>Saldo</h2><div class="grid2">
   <div class="stat"><span>${esc(L('modal'))} uang</span><b>${money(R.modalCash)}</b></div><div class="stat"><span>${esc(L('modal'))} fisik (stok)</span><b>${money(R.modalFisik)}</b></div>
   <div class="stat"><span>${esc(L('kas'))} tunai</span><b>${money(R.wallet.tunai)}</b></div><div class="stat"><span>Rekening</span><b>${money(R.wallet.digital-R.titipan)}</b></div>
   <div class="stat"><span>Digital lain</span><b>${money(R.wallet.ewallet)}</b></div><div class="stat"><span>Dana pulsa</span><b>${money(R.pulsaFund)}</b></div>
   <div class="stat"><span>${esc(L('laba'))} periode ini</span><b class="pos">${money(R.pProfit)}</b></div><div class="stat"><span>Saldo ${esc(L('laba').toLowerCase())}</span><b>${money(R.kas.laba)}</b></div>
   <div class="stat"><span>${esc(L('bon'))}</span><b>${money(R.bonTotal)}</b></div><div class="stat"><span>${esc(L('kredit'))}</span><b>${money(R.kreditTotal)}</b></div>
  </div>${R.titipan?`<p class="mut" style="font-size:12px;margin:8px 0 0">Titipan belum diambil ${money(R.titipan)} (tidak dihitung sebagai kas Anda)</p>`:''}</section>`;
  if(H.transaksi)o+=txSection(R);
  return o||'<div class="empty wide">Semua bagian beranda disembunyikan. Atur di Pengaturan → Tampilan beranda.</div>'};
function txSection(R){const f=SUB.txf||'Semua';const q=(SUB.q||'').toLowerCase();const lim=SUB.lim||30;
  const groups=['Semua','Penjualan','Pengeluaran','Pemasukan','Kewajiban','Modal','Bon','Digital'];
  const list=[...S.tx].sort((a,b)=>String(b.date).localeCompare(String(a.date))).filter(t=>{const i=txInfo(t);return(f==='Semua'||i.g===f)&&(!q||(i.ti+' '+i.sub+' '+(t.desc||'')).toLowerCase().includes(q))});
  let sumIn=0,sumOut=0;list.forEach(t=>{const i=txInfo(t);if(i.s>0)sumIn+=+i.v||0;if(i.s<0)sumOut+=+i.v||0});
  return `<section class="card wide" id="txsec"><div class="row"><h2 class="sp" style="margin:0">${esc(L('transaksi'))}</h2><button class="btn sm pri" data-act="quickAdd">${ic('plus')} Catat</button><button class="btn sm" data-act="shareList">${ic('share')}</button></div>
   <input class="inp" id="txq" placeholder="Cari transaksi, produk, nama…" value="${esc(SUB.q||'')}" style="margin-top:10px">
   <div class="tabs" style="margin-top:10px">${groups.map(g=>`<button class="${g===f?'on':''}" data-act="txf" data-v="${g}">${g}</button>`).join('')}</div>
   <div class="grid3" style="margin:10px 0"><div class="stat"><span>Masuk</span><b class="pos">${money(sumIn)}</b></div><div class="stat"><span>Keluar</span><b class="neg">${money(sumOut)}</b></div><div class="stat"><span>Jumlah</span><b>${list.length}</b></div></div>
   <div class="list">${list.length?list.slice(0,lim).map(txRow).join(''):'<div class="empty">Belum ada transaksi. Tekan tombol <b>Catat</b> di tengah bawah.</div>'}</div>
   ${list.length>lim?`<button class="btn" data-act="moreTx" style="margin-top:10px;width:100%">Tampilkan lebih banyak (${list.length-lim} lagi)</button>`:''}</section>`}
AFTER.home=()=>{const q=$('#txq');q&&q.addEventListener('input',()=>{SUB.q=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{render();const n=$('#txq');n.focus();n.setSelectionRange(n.value.length,n.value.length)},350)})};
function alertRow(a){return `<div class="item" role="button" tabindex="0" data-act="go" data-v="${a.go}"><div class="t"><b>${esc(a.title)}</b><small>${esc(a.text)}</small></div><span class="pill ${a.lvl}">${a.lvl==='bad'?'Segera':'Ingat'}</span></div>`}
VIEWS.alerts=R=>{const A=buildAlerts(R);let perm='Notification' in window?Notification.permission:'tidak didukung';
  return `<section class="card"><h2>Pengingat aktif</h2><div class="list">${A.length?A.map(alertRow).join(''):'<div class="empty">Tidak ada pengingat. Semua kewajiban aman untuk saat ini.</div>'}</div></section>
  <section class="card pat"><h2>Cara pemberitahuan</h2><div style="display:grid;gap:8px">
   ${[['sound','Nada dering'],['vib','Getaran'],['flash','Layar berkedip'],['msg','Pesan di layar']].map(([k,l])=>`<label class="chk"><input type="checkbox" data-act="notifSet" data-v="${k}" ${S.settings.notif[k]?'checked':''}> ${l}</label>`).join('')}
   <label class="f">Jam pengingat (pisahkan dengan koma)<input class="inp" id="remTimes" value="${esc(S.settings.remindTimes)}"></label>
   <label class="f">Ingatkan berapa hari sebelum jatuh tempo<input class="inp" id="remDays" type="number" min="0" max="30" value="${S.settings.remindDays}"></label>
   <div class="row"><button class="btn pri" data-act="saveRem">Simpan</button><button class="btn" data-act="testAlert">Uji pemberitahuan</button><button class="btn" data-act="askNotif">Izinkan notifikasi (${esc(perm)})</button></div>
   <p class="mut" style="margin:0;font-size:12px">Notifikasi sistem, getaran, dan suara berjalan penuh saat file HTML dibuka di Chrome atau di versi APK/EXE. Di pratinjau artifact, pengingat tampil sebagai pesan di layar.</p></div></section>`};

VIEWS.target=R=>{const P=R.p;const now=new Date();
  const rows=[...S.obligations].sort((a,b)=>dueDateOf(a,P)-dueDateOf(b,P)).map(o=>{const paid=Math.min(+o.amount||0,R.obPaid[o.id]||0);const left=(+o.amount||0)-paid;const due=dueDateOf(o,P);const dd=dayDiff(due,now);
   const st=left<=0?['ok','Lunas']:dd<0?['bad','Terlambat']:dd<=S.settings.remindDays?['warn',dd===0?'Hari ini':dd+' hari']:['',o.day?'Tgl '+o.day:'Sebelum tgl '+S.settings.targetDay];
   return `<div class="item" style="display:grid;gap:6px"><div class="row"><div class="t sp"><b>${esc(o.name)}</b><small>${o.day?'Jatuh tempo tgl '+o.day:'Tanpa tanggal · paling lambat tgl '+S.settings.targetDay}</small></div><span class="pill ${st[0]}">${st[1]}</span></div>
    <div class="bar"><i style="width:${o.amount?Math.round(paid/o.amount*100):0}%"></i></div>
    <div class="row" style="font-size:12.5px"><span class="money">${money(paid)} / ${money(o.amount)}</span><span class="sp"></span><b class="money ${left>0?'neg':'pos'}">sisa ${money(left)}</b></div>
    <div class="row"><button class="btn sm pri" data-act="payOb" data-v="${o.id}">Bayar</button><button class="btn sm" data-act="editOb" data-v="${o.id}">Ubah</button><button class="btn sm dan" data-act="delOb" data-v="${o.id}">Hapus</button></div></div>`}).join('');
  // minggu
  const weeks=[];let ws=new Date(P.start);while(ws<=P.end){const we=new Date(Math.min(new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6,23,59,59),P.end));weeks.push([new Date(ws),we]);ws=new Date(we.getFullYear(),we.getMonth(),we.getDate()+1)}
  const perW=Math.ceil(R.obTotal/weeks.length);const perD=Math.ceil(R.obTotal/R.totalDays);
  const wk=weeks.map(([a,b],i)=>{let got=0;for(const[k,v] of Object.entries(R.daily)){const d=parseD(k);if(d>=a&&d<=b)got+=v}const cur=now>=a&&now<=b;
    return `<tr${cur?' style="font-weight:700"':''}><td>Minggu ${i+1}${cur?' ·  sekarang':''}<br><span class="mut" style="font-size:11px">${a.getDate()}/${a.getMonth()+1} – ${b.getDate()}/${b.getMonth()+1}</span></td><td class="r">${money(perW)}</td><td class="r ${got>=perW?'pos':''}">${money(got)}</td></tr>`}).join('');
  const todayGot=R.daily[todayISO()]||0;
  return `<section class="card hero wide"><div class="eyebrow">Periode ${P.start.toLocaleDateString('id-ID',{day:'numeric',month:'short'})} – ${P.end.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}</div>
   <div class="big">${money(R.obTotal)}</div><div style="opacity:.85;font-size:12.5px">Target bulanan (wajib) · ${S.obligations.length} ${esc(L('kewajiban').toLowerCase())}</div>
   <div class="bar" style="margin:12px 0"><i style="width:${R.pct}%"></i></div>
   <div class="grid2"><div class="stat"><span>Sudah dibayar</span><b>${money(R.obPaidTotal)}</b></div><div class="stat"><span>Sisa ${esc(L('kewajiban').toLowerCase())}</span><b>${money(R.obLeft)}</b></div>
   <div class="stat"><span>Dana target terkumpul</span><b>${money(R.available)}</b></div><div class="stat"><span>Masih kurang</span><b>${money(R.shortfall)}</b></div></div></section>
  <section class="card pat"><h2>Target pendapatan (informasi)</h2>
   <div class="grid2"><div class="stat"><span>Harus didapat per hari (${R.daysLeft} hari lagi)</span><b>${money(R.perDay)}</b></div><div class="stat"><span>Per minggu</span><b>${money(R.perWeek)}</b></div>
   <div class="stat"><span>Pencapaian hari ini</span><b class="${todayGot>=R.perDay?'pos':''}">${money(todayGot)}</b></div><div class="stat"><span>Rata-rata awal periode / hari</span><b>${money(perD)}</b></div></div>
   <div style="margin-top:10px"><div class="eyebrow">Pencapaian dihitung dari</div><div class="tabs" style="margin-top:6px">
    <button class="${S.settings.targetMode==='laba'?'on':''}" data-act="tMode" data-v="laba">Keuntungan saja</button><button class="${S.settings.targetMode==='laba_lain'?'on':''}" data-act="tMode" data-v="laba_lain">Keuntungan + pemasukan lain</button></div>
   <p class="mut" style="font-size:12px;margin:8px 0 0">Modal tidak pernah dihitung sebagai pencapaian. Keuntungan periode ini ${money(R.pProfit)}, pemasukan lain ${money(R.pOther)}, sudah dipakai bayar ${money(R.pPaidFromKas)}.</p></div></section>
  <section class="card"><h2>Per minggu</h2><div class="scroll-x"><table class="tbl"><thead><tr><th>Minggu</th><th class="r">Target</th><th class="r">Tercapai</th></tr></thead><tbody>${wk}</tbody></table></div></section>
  <section class="card wide"><div class="row"><h2 class="sp">Daftar ${esc(L('kewajiban').toLowerCase())}</h2><button class="btn sm pri" data-act="editOb">+ Tambah</button><button class="btn sm" data-act="shareTarget">${ic('share')}</button></div>
   <div class="list">${rows||'<div class="empty">Belum ada kewajiban.</div>'}</div>
   <div class="row" style="margin-top:10px"><label class="f sp">Tanggal target bulanan<input class="inp" id="tDay" type="number" min="1" max="31" value="${S.settings.targetDay}"></label><button class="btn" data-act="saveTDay" style="align-self:end">Simpan</button></div></section>
  ${obEditor()}`};
function obEditor(){const list=[...S.obligations].sort((a,b)=>(a.day||S.settings.targetDay)-(b.day||S.settings.targetDay));
  return `<section class="card wide pat" id="obEd"><h2>Atur ${esc(L('kewajiban').toLowerCase())}</h2><p class="mut" style="font-size:12px;margin:0 0 10px">Ubah nama, jumlah rupiah, dan tanggal jatuh tempo langsung di sini. Kosongkan tanggal jika dibayar paling lambat tgl ${S.settings.targetDay}. Urutan mengikuti jadwal tanggal.</p>
   <div class="obgrid obhead"><span>Nama</span><span>Jumlah <small>(${S.settings.inputRibuan?'ribuan':'rupiah'})</small></span><span>Tgl</span><span></span></div>
   <div style="display:grid;gap:8px">${list.map(o=>`<div class="obgrid"><input class="inp" data-obf="name" data-id="${o.id}" value="${esc(o.name)}" placeholder="Nama kewajiban" aria-label="Nama"><input class="inp money" data-obf="amount" data-id="${o.id}" inputmode="decimal" value="${esc(moneyInputVal(o.amount))}" placeholder="0" aria-label="Jumlah"><input class="inp" data-obf="day" data-id="${o.id}" type="number" min="1" max="31" value="${o.day||''}" placeholder="${S.settings.targetDay}" aria-label="Tanggal"><button class="btn sm dan" data-act="obDelRow" data-v="${o.id}" aria-label="Hapus">${ic('trash')}</button></div>`).join('')}</div>
   <div class="row" style="margin-top:10px"><button class="btn" data-act="obAddRow">+ Tambah ${esc(L('kewajiban').toLowerCase())}</button><span class="sp"></span><b class="money" id="obTot">Total ${money(S.obligations.reduce((s,o)=>s+(+o.amount||0),0))}</b></div>
   <button class="btn pri" data-act="obSaveAll" style="margin-top:10px;width:100%">Simpan semua</button></section>`}
function obCollect(){document.querySelectorAll('[data-obf]').forEach(i=>{const o=S.obligations.find(x=>x.id===i.dataset.id);if(!o)return;const f=i.dataset.obf;
  if(f==='name')o.name=i.value.trim();else if(f==='amount')o.amount=parseMoney(i.value);else o.day=i.value.trim()?Math.min(31,Math.max(1,Math.round(+i.value)||1)):null})}
function openOb(id){const o=id?S.obligations.find(x=>x.id===id):{name:'',amount:0,day:''};
  openSheet(id?'Ubah kewajiban':'Kewajiban baru',`<label class="f">Nama kewajiban<input class="inp" id="obN" value="${esc(o.name)}"></label>
   <label class="f">Jumlah per bulan <span class="mut" style="font-weight:500">(${unitHint()})</span><input class="inp money" id="obA" inputmode="decimal" value="${esc(moneyInputVal(o.amount))}"></label>
   <label class="f">Tanggal jatuh tempo (kosongkan jika tanpa tanggal)<input class="inp" id="obD" type="number" min="1" max="31" value="${o.day||''}"></label>`,()=>{
    const n=$('#obN').value.trim(),a=parseMoney($('#obA').value),d=+$('#obD').value||null;if(!n||!a){toast('Isi nama dan jumlah');return}
    if(id)Object.assign(o,{name:n,amount:a,day:d});else S.obligations.push({id:uid(),name:n,amount:a,day:d});save();closeSheet();render()})}

function quickAdd(){const items=[['sale','Penjualan','Barang, pulsa, transfer kita'],['keluar','Pengeluaran','Bayar kewajiban, biaya, belanja stok, isi dana pulsa'],['masuk','Pemasukan','Gaji, bayar piutang, angsuran kredit, tambah modal'],['trf','Transfer titipan','Uang masuk untuk diambil orang lain'],['kredit',L('kredit')+' baru','HP, baju, barang lain']];

function heroBg(h){const im=h.imgs;if(!im.length)return '';const u=x=>`url(${x.src})`;const pos=`50% ${h.pos??50}%`;const f=im.length>1&&h.fit!=='kolase'&&h.fit!=='slide'?h.fit:h.fit;const a=im[0];

   ${has?`<div class="hbg">${heroBg(h)}</div><div class="hshade"></div>`:''}${quote||(h.size==='besar'?'<div style="flex:1"></div>':'')}${h.hideTarget?marq:nums}${pbar}</section>`}

function readHeroImg(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);
   const edge=x0=>{const w=Math.max(2,Math.round(c.width*.03));const d=g.getImageData(x0?c.width-w:0,0,w,c.height).data;let r=0,gg=0,b=0,n=0;for(let i=0;i<d.length;i+=16){r+=d[i];gg+=d[i+1];b+=d[i+2];n++}return `rgb(${Math.round(r/n)},${Math.round(gg/n)},${Math.round(b/n)})`};
   res({src:c.toDataURL('image/jpeg',.82),w:c.width,h:c.height,left:edge(0),right:edge(1)})};img.onerror=()=>res(null);img.src=fr.result};fr.readAsDataURL(file)})}

// ================= Diagram =================
const KC=['var(--k1)','var(--k2)','var(--k3)','var(--k4)','var(--k5)','var(--k6)','var(--k7)','var(--k8)','var(--k9)'];
const pctS=(v,t)=>t?(Math.round(v/t*1000)/10).toLocaleString('id-ID')+'%':'0%';
function arcPath(cx,cy,r,a0,a1,ri){const p=(a,rr)=>[cx+rr*Math.sin(a),cy-rr*Math.cos(a)];const big=a1-a0>Math.PI?1:0;const[x0,y0]=p(a0,r),[x1,y1]=p(a1,r);
  if(ri){const[x2,y2]=p(a1,ri),[x3,y3]=p(a0,ri);return `M${x0} ${y0}A${r} ${r} 0 ${big} 1 ${x1} ${y1}L${x2} ${y2}A${ri} ${ri} 0 ${big} 0 ${x3} ${y3}Z`}
  return `M${cx} ${cy}L${x0} ${y0}A${r} ${r} 0 ${big} 1 ${x1} ${y1}Z`}
function chartBox(items,opt={}){const model=opt.model||S.settings.chartModel||'donat';const it=items.filter(x=>x.v>0);const total=opt.total||it.reduce((s,x)=>s+x.v,0);
  it.forEach((x,i)=>x.c=x.c||KC[i%KC.length]);
  const legend=`<div class="legend">${items.map((x,i)=>`<div><i style="background:${x.c||KC[i%KC.length]}"></i><span>${esc(x.l)}</span><b>${money(x.v)}<small>${pctS(Math.max(0,x.v),total)}</small></b></div>`).join('')}</div>`;
  if(!it.length)return `<div class="empty">Belum ada data untuk diagram ini.</div>`;
  if(model==='batang'){const mx=Math.max(...it.map(x=>x.v));return `<div class="vbars" role="img" aria-label="${esc(opt.title||'Diagram batang')}">${it.map(x=>`<div title="${esc(x.l)}"><i style="height:${Math.max(2,x.v/mx*100)}%;background:${x.c}"></i></div>`).join('')}</div><div class="vlabels">${it.map(x=>`<span>${pctS(x.v,total)}</span>`).join('')}</div><div style="margin-top:10px">${legend}</div>`}
  if(model==='garis')return `<div class="hbars">${it.map(x=>`<div class="hb"><div class="row"><span class="sp">${esc(x.l)}</span><b class="money">${money(x.v)}</b><span class="mut" style="min-width:48px;text-align:right">${pctS(x.v,total)}</span></div><div class="tr"><i style="width:${Math.max(1,x.v/total*100)}%;background:${x.c}"></i></div></div>`).join('')}</div>`;
  let a=0;const ri=model==='pie'?0:34;const segs=it.map(x=>{const da=x.v/total*Math.PI*2;const s=da>=Math.PI*2-1e-6?(ri?`<circle cx="60" cy="60" r="${(56+ri)/2}" fill="none" style="stroke:${x.c};stroke-width:${56-ri}"/>`:`<circle cx="60" cy="60" r="56" style="fill:${x.c}"/>`):`<path d="${arcPath(60,60,56,a,a+da,ri)}" style="fill:${x.c};stroke:var(--surface);stroke-width:1.5"/>`;a+=da;return s}).join('');
  const center=ri&&opt.center?`<text x="60" y="58" text-anchor="middle" font-size="15" font-weight="600" style="fill:var(--ink)">${esc(opt.center)}</text><text x="60" y="74" text-anchor="middle" font-size="8" style="fill:var(--muted)">${esc(opt.sub||'')}</text>`:'';
  return `<div class="chart"><svg viewBox="0 0 120 120" role="img" aria-label="${esc(opt.title||'Diagram')}">${segs}${center}</svg>${legend}</div>`}
function diagramView(R){const P=R.p;const mod=S.settings.chartModel||'donat';const pf=t=>inP(t.date,P);
  const card=(t,sub,body)=>`<section class="card wide"><h2 style="margin-bottom:2px">${t}</h2>${sub?`<p class="mut" style="font-size:12px;margin:0 0 10px">${sub}</p>`:''}${body}</section>`;
  let o=`<section class="card wide"><div class="row"><div class="sp"><div class="eyebrow">Diagram otomatis</div><b>Periode ${P.start.toLocaleDateString('id-ID',{day:'numeric',month:'short'})} – ${P.end.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}</b></div><span class="pill">${({donat:'Donat',pie:'Lingkaran',batang:'Batang',garis:'Garis'})[mod]}</span></div><p class="mut" style="font-size:12px;margin:6px 0 0">Diagram dihitung dari semua transaksi dan tidak bisa diubah langsung. Model diagram dipilih di Pengaturan.</p></section>`;
  // target
  o+=card('Target '+L('kewajiban').toLowerCase(),`Total ${money(R.obTotal)} · tercapai ${R.pct}%`,chartBox([{l:'Sudah dibayar',v:R.obPaidTotal,c:'var(--k1)'},{l:'Dana terkumpul',v:Math.min(R.available,R.obLeft),c:'var(--k6)'},{l:'Masih kurang',v:R.shortfall,c:'var(--k4)'}],{total:R.obTotal,center:R.pct+'%',sub:'tercapai',title:'Target'}));
  o+=card('Per '+L('kewajiban').toLowerCase(),'Bagian tiap kewajiban dari target bulanan',`<div class="hbars">${[...S.obligations].sort((a,b)=>dueDateOf(a,P)-dueDateOf(b,P)).map((x,i)=>{const pd=Math.min(x.amount,R.obPaid[x.id]||0);return `<div class="hb"><div class="row"><span class="sp">${esc(x.name)}${x.day?' · tgl '+x.day:''}</span><b class="money">${money(pd)} / ${money(x.amount)}</b><span class="mut" style="min-width:44px;text-align:right">${pctS(pd,x.amount)}</span></div><div class="tr"><i style="width:${x.amount?pd/x.amount*100:0}%;background:${KC[i%KC.length]}"></i></div></div>`}).join('')}</div>`);
  // aset
  const aset=[{l:L('modal')+' uang',v:Math.max(0,R.modalCash)},{l:'Stok barang',v:R.modalFisik},{l:L('kas')+' tunai',v:Math.max(0,R.wallet.tunai)},{l:'Rekening',v:Math.max(0,R.wallet.digital-R.titipan)},{l:'Digital lain',v:Math.max(0,R.wallet.ewallet)},{l:L('bon'),v:R.bonTotal},{l:L('kredit'),v:R.kreditTotal}];
  const at=aset.reduce((s,x)=>s+x.v,0);
  o+=card('Komposisi uang & aset',`Total ${money(at)}`,chartBox(aset,{center:money(at,{noRp:true}),sub:'total aset',title:'Komposisi aset'}));
  // modal
  o+=card(L('modal')+' per kategori',`Uang ${money(R.modalCash)} · stok ${money(R.modalFisik)}`,chartBox([...S.cats.map(c=>({l:c.name,v:Math.max(0,R.modal[c.id]||0)})),...(R.pulsaFund?[{l:'Dana pulsa',v:R.pulsaFund}]:[]),{l:'Stok barang',v:R.modalFisik}],{title:'Modal'}));
  // keuntungan
  const prof={};const add=(k,v)=>{if(v)prof[k]=(prof[k]||0)+v};
  S.tx.filter(pf).forEach(t=>{const pr=(+t.price||0)-(+t.cost||t._cost||0);
    if(t.type==='sale'&&t.ok!==false&&t.wallet!=='utang')add((S.pcats.find(c=>c.id===t.pcat)||{name:'Penjualan'}).name,pr);
    else if(t.type==='jual'&&!t.utang)add('Penjualan',pr);else if(t.type==='pulsa'&&t.ok!==false&&!t.utang)add('Pulsa & digital',pr);
    else if(t.type==='trf'||t.type==='trf_out')add('Biaya admin transfer',+t.fee||0)});
  S.tx.filter(t=>t.type==='bon_bayar'&&pf(t)).forEach(t=>add('Pelunasan piutang',0));

const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,fixA=a=>a-360*Math.floor(a/360),fixH=h=>h-24*Math.floor(h/24);
function prayerTimes(date,lat,lng,tz){
  const jd=(()=>{let y=date.getFullYear(),m=date.getMonth()+1,d=date.getDate();if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5})()-lng/(15*24);
  const sun=t=>{const D=jd+t-2451545;const g=fixA(357.529+.98560028*D),q=fixA(280.459+.98564736*D),L=fixA(q+1.915*Math.sin(rad(g))+.02*Math.sin(rad(2*g))),e=23.439-.00000036*D;
   const RA=deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)),Math.cos(rad(L))))/15;return{decl:deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L)))),eqt:q/15-fixH(RA)}};
  const noon=t=>fixH(12-sun(t).eqt);
  const T=(ang,t,dir)=>{const s=sun(t);const v=(-Math.sin(rad(ang))-Math.sin(rad(s.decl))*Math.sin(rad(lat)))/(Math.cos(rad(s.decl))*Math.cos(rad(lat)));const h=deg(Math.acos(Math.max(-1,Math.min(1,v))))/15;return noon(t)+(dir<0?-h:h)};
  const asr=t=>{const s=sun(t);const a=-deg(Math.atan(1/(1+Math.tan(rad(Math.abs(lat-s.decl))))));return T(a,t,1)};
  const adj=h=>h+tz-lng/15;const ih=2/60;
  const r={subuh:adj(T(20,5/24,-1))+ih,terbit:adj(T(.833,6/24,-1))-ih,dzuhur:adj(noon(.5))+ih,ashar:adj(asr(13/24))+ih,maghrib:adj(T(.833,18/24,1))+ih,isya:adj(T(18,18/24,1))+ih};r.imsak=r.subuh-10/60;return r}
const hm=h=>{h=fixH(h+.5/60);const H=Math.floor(h),M=Math.floor((h-H)*60);return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0')};
function qibla(lat,lng){const k=[21.4225,39.8262];const d=rad(k[1]-lng);return fixA(deg(Math.atan2(Math.sin(d),Math.cos(rad(lat))*Math.tan(rad(k[0]))-Math.sin(rad(lat))*Math.cos(d))))}

function enhanceScroll(){document.querySelectorAll('.tabs').forEach(t=>{if(t._e)return;t._e=1;
  t.addEventListener('wheel',e=>{if(t.scrollWidth>t.clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){t.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
  let sx=0,sl=0,dn=false,mv=false;t.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;dn=true;mv=false;sx=e.clientX;sl=t.scrollLeft});
  t.addEventListener('pointermove',e=>{if(!dn)return;const d=e.clientX-sx;if(Math.abs(d)>5)mv=true;t.scrollLeft=sl-d});
  window.addEventListener('pointerup',()=>{dn=false;setTimeout(()=>mv=false,0)});t.addEventListener('click',e=>{if(mv){e.stopPropagation();e.preventDefault()}},true);
  const on=t.querySelector('.on');if(on&&t.scrollWidth>t.clientWidth)t.scrollLeft=on.offsetLeft-t.clientWidth/2+on.offsetWidth/2;
  const upd=()=>{t.classList.toggle('more-r',t.scrollLeft+t.clientWidth<t.scrollWidth-4);t.classList.toggle('more-l',t.scrollLeft>4)};t.addEventListener('scroll',upd);upd()});
  document.querySelectorAll('textarea.grow').forEach(autoGrow)}
function autoGrow(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
function updateShareLinks(){const t=$('#shTxt');if(!t)return;let txt=t.value;const waTxt=t.dataset.mono?'```\n'+txt+'\n```':txt;
  document.querySelectorAll('[data-wa]').forEach(a=>{const n=a.dataset.wa;a.href=`https://wa.me/${n?String(n).replace(/\D/g,'').replace(/^0/,'62'):''}?text=${encodeURIComponent(waTxt)}`});
  document.querySelectorAll('[data-gm]').forEach(a=>a.href=`https://mail.google.com/mail/?view=cm&fs=1&su=${a.dataset.gm}&body=${encodeURIComponent(txt)}`)}
async function autoLocate(force){if(!navigator.geolocation)return;const l=S.settings.loc;if(!force&&l.at&&Date.now()-l.at<6*3600e3)return;
  navigator.geolocation.getCurrentPosition(async p=>{const lat=+p.coords.latitude.toFixed(6),lng=+p.coords.longitude.toFixed(6);let g={};try{g=await reverseGeo(lat,lng)}catch(e){}
   S.settings.loc={...S.settings.loc,lat,lng,at:Date.now(),...(g.name?{desa:g.desa,kec:g.kec,kab:g.kab,name:g.name}:{})};save();if(['home','sholat','peta'].includes(VIEW))render();if(force)toast(g.name?'Lokasi: '+g.name:'Koordinat diperbarui')},
   ()=>{if(force)toast('Izin lokasi ditolak. Isi lokasi di halaman Jadwal Sholat.')},{enableHighAccuracy:true,timeout:15000,maximumAge:600000})}

const hashStr=s=>{let h=2166136261;for(const c of 'rgmc|'+s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)};
let LOCKBUF='';
function showLock(){const t=S.settings.lock.type;if(t==='none')return;const el=$('#lock');el.hidden=false;LOCKBUF='';
  el.innerHTML=`<div style="text-align:center;width:100%;max-width:320px"><div style="font-weight:800;font-size:20px">Rgm Gocell</div><div style="opacity:.8;margin-top:4px" id="lkMsg">${t==='pin'?'Masukkan sandi':t==='pola'?'Gambar pola':'Gunakan sidik jari'}</div>
  ${t==='pin'?`<div class="dots" id="lkDots"></div><div class="pad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'OK'].map(k=>`<button data-act="lkKey" data-v="${k}">${k}</button>`).join('')}</div>`:t==='pola'?`<canvas class="pattern" id="lkPat" width="480" height="480"></canvas>`:`<button class="btn pri" data-act="lkBio" style="margin-top:20px">Pindai sidik jari</button><div style="margin-top:14px"><button class="btn sm" data-act="lkFallback">Pakai sandi cadangan</button></div>`}</div>`;
  if(t==='pola')patternPad($('#lkPat'),seq=>{if(hashStr(seq)===S.settings.lock.hash)unlock();else{$('#lkMsg').textContent='Pola salah, coba lagi'}});if(t==='bio')bioVerify()}
function unlock(){$('#lock').hidden=true;$('#lock').innerHTML=''}
function patternPad(cv,done){const ctx=cv.getContext('2d');const P=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)P.push([80+c*160,80+r*160]);let seq=[],cur=null,down=false;
  const col=getComputedStyle(document.documentElement).getPropertyValue('--accent2')||'#fff';
  const draw=()=>{ctx.clearRect(0,0,480,480);ctx.lineWidth=10;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineCap='round';ctx.beginPath();seq.forEach((i,j)=>j?ctx.lineTo(...P[i]):ctx.moveTo(...P[i]));if(cur&&seq.length)ctx.lineTo(...cur);ctx.stroke();
   P.forEach((p,i)=>{ctx.beginPath();ctx.arc(p[0],p[1],seq.includes(i)?26:16,0,7);ctx.fillStyle=seq.includes(i)?'#fff':'rgba(255,255,255,.35)';ctx.fill()})};
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*480/r.width,(e.clientY-r.top)*480/r.height]};
  const hit=p=>{P.forEach((q,i)=>{if(!seq.includes(i)&&Math.hypot(q[0]-p[0],q[1]-p[1])<55)seq.push(i)})};
  cv.onpointerdown=e=>{down=true;seq=[];cv.setPointerCapture(e.pointerId);hit(pt(e));draw()};cv.onpointermove=e=>{if(!down)return;cur=pt(e);hit(cur);draw()};
  cv.onpointerup=()=>{down=false;cur=null;draw();if(seq.length>=4)done(seq.join(''));else if(seq.length)toast('Pola minimal 4 titik');setTimeout(()=>{seq=[];draw()},400)};draw()}
async function bioVerify(){try{const c=S.settings.lock.cred;if(!c||!window.PublicKeyCredential)throw 0;
  await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(16)),allowCredentials:[{type:'public-key',id:Uint8Array.from(atob(c),x=>x.charCodeAt(0))}],userVerification:'required',timeout:60000}});unlock()}
  catch(e){const m=$('#lkMsg');if(m)m.textContent='Sidik jari belum tersedia di sini. Pakai sandi cadangan.'}}
async function bioRegister(){try{if(!window.PublicKeyCredential)throw 0;const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(16)),rp:{name:'Rgm Gocell'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'pemilik',displayName:'Pemilik'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
  return btoa(String.fromCharCode(...new Uint8Array(cred.rawId)))}catch(e){return null}}
function setupLock(type){
  if(type==='none'){S.settings.lock={type:'none',hash:'',cred:''};save();render();return}
  if(type==='pin'){openSheet('Atur sandi',`<label class="f">Sandi baru (4–8 angka)<input class="inp money" id="pin1" type="password" inputmode="numeric" maxlength="8"></label><label class="f">Ulangi sandi<input class="inp money" id="pin2" type="password" inputmode="numeric" maxlength="8"></label>`,()=>{
    const a=$('#pin1').value,b=$('#pin2').value;if(!/^\d{4,8}$/.test(a)){toast('Sandi 4–8 angka');return}if(a!==b){toast('Sandi tidak sama');return}S.settings.lock={type:'pin',hash:hashStr(a),cred:'',pinHash:hashStr(a)};save();closeSheet();render();toast('Sandi aktif')});return}
  if(type==='pola'){openSheet('Gambar pola baru',`<div style="background:linear-gradient(140deg,var(--hero1),var(--hero2));border-radius:16px;padding:12px"><canvas class="pattern" id="setPat" width="480" height="480"></canvas></div><p class="mut" id="patMsg">Hubungkan minimal 4 titik.</p>`);
    let first=null;patternPad($('#setPat'),seq=>{if(!first){first=seq;$('#patMsg').textContent='Ulangi pola untuk konfirmasi.'}else if(first===seq){S.settings.lock={type:'pola',hash:hashStr(seq),cred:'',pinHash:S.settings.lock.pinHash||''};save();closeSheet();render();toast('Pola aktif')}else{first=null;$('#patMsg').textContent='Pola berbeda. Ulangi dari awal.'}});return}
  if(type==='bio'){openSheet('Sidik jari',`<p>Daftarkan sidik jari perangkat ini, lalu buat sandi cadangan.</p><label class="f">Sandi cadangan (4–8 angka)<input class="inp money" id="pin1" type="password" inputmode="numeric" maxlength="8"></label>`,async()=>{
    const a=$('#pin1').value;if(!/^\d{4,8}$/.test(a)){toast('Sandi cadangan 4–8 angka');return}const cred=await bioRegister();
    if(!cred){toast('Sensor sidik jari tidak tersedia di browser ini. Fitur aktif penuh di APK.');return}S.settings.lock={type:'bio',hash:hashStr(a),cred,pinHash:hashStr(a)};save();closeSheet();render();toast('Sidik jari aktif')},'Daftarkan')}}

  return o}
function dataGudang(R){const t=SUB.gdTab||'target';
  const tabs=[['target','Target'],['produk','Produk & harga'],['kategori','Kategori'],['piutang','Piutang'],['kredit','Kredit'],['titipan','Titipan transfer'],['transaksi','Semua transaksi']];
  let o=`<section class="card wide"><div class="tabs">${tabs.map(([k,l])=>`<button class="${t===k?'on':''}" data-act="gdTab" data-v="${k}">${l}</button>`).join('')}</div></section>`;
  if(t==='target')o+=`<section class="card wide"><h2>Target bulanan</h2><div class="row"><label class="f sp">Tanggal target bulanan<input class="inp" id="tDay" type="number" min="1" max="31" value="${S.settings.targetDay}"></label><button class="btn" data-act="saveTDay" style="align-self:end">Simpan</button></div>
    <div class="eyebrow" style="margin-top:10px">Pencapaian dihitung dari</div><div class="tabs" style="margin-top:6px"><button class="${S.settings.targetMode==='laba'?'on':''}" data-act="tMode" data-v="laba">Keuntungan saja</button><button class="${S.settings.targetMode==='laba_lain'?'on':''}" data-act="tMode" data-v="laba_lain">Keuntungan + pemasukan lain</button></div></section>`+obEditor();
  if(t==='produk')o+=`<section class="card wide" id="sec-produk"><div class="row"><h2 class="sp" style="margin:0">Daftar produk</h2><button class="btn sm pri" data-act="prodAdd">+ Tambah produk</button></div>
    <p class="mut" style="font-size:12px;margin:6px 0 10px">Isi harga jual dan modal sekali saja. Saat mencatat penjualan, harga, modal, dan sumber modal terisi otomatis.</p>${prodTable()}</section>
    <section class="card wide">${kindList('pcats','Kategori produk',x=>`<select class="inp" style="width:auto" data-pkind="${x.id}" aria-label="Jenis">${[['barang','Barang'],['digital','Pulsa/digital'],['transfer','Transfer kita']].map(([a,b])=>`<option value="${a}" ${x.kind===a?'selected':''}>${b}</option>`).join('')}</select>`)}<button class="btn pri" data-act="saveLabels" style="margin-top:12px">Simpan kategori</button></section>`;
  if(t==='kategori')o+=`<section class="card wide"><h2>Nama menu & bagian</h2><div class="grid2">${Object.keys(DEFAULT_LABELS).map(k=>`<label class="f">${esc(DEFAULT_LABELS[k])}<input class="inp" data-label="${k}" value="${esc(L(k))}"></label>`).join('')}</div>${kindList('cats','Kategori modal')}${kindList('creditTypes','Kategori kredit',x=>`<label class="chk" style="white-space:nowrap"><input type="checkbox" data-act="ctDev" data-v="${x.id}" ${x.device?'checked':''}> Data HP</label>`)}${kindList('expKinds','Kategori pengeluaran')}${kindList('incKinds','Kategori pemasukan')}<button class="btn pri" data-act="saveLabels" style="margin-top:12px">Simpan semua kategori</button></section>`;
  if(t==='piutang')o+=VIEWS.piutang(R);
  if(t==='kredit')o+=VIEWS.kredit(R);
  if(t==='titipan'){const l=[...S.tx].filter(x=>x.type==='trf').sort((a,b)=>String(b.date).localeCompare(String(a.date)));
   o+=`<section class="card wide"><div class="row"><h2 class="sp" style="margin:0">Titipan transfer</h2><button class="btn sm pri" data-act="newTx" data-v="trf">+ Titipan</button></div><p class="mut" style="font-size:12px;margin:6px 0 10px">Centang saat uang sudah diserahkan. Data tetap tersimpan.</p><div class="list">${l.length?l.map(x=>`<div class="item"><label class="chk" title="Sudah diambil"><input type="checkbox" data-act="trfToggle" data-v="${x.id}" ${x.taken?'checked':''}></label>${x.photo?`<img class="th" src="${x.photo}" alt="">`:''}<div class="t" role="button" tabindex="0" data-act="txDetail" data-v="${x.id}"><b>${esc(x.receiver||'Penerima')}${x.taker&&x.taker!==x.receiver?' → diambil '+esc(x.taker):''}</b><small>Transfer ${fmtDate(x.date)}${x.from?' dari '+esc(x.from):''}${x.account?' · '+esc(x.account):''}</small>${x.taken?`<small>Diambil ${fmtDate(x.dateTaken)}</small>`:''}<span class="pill ${x.taken?'ok':'warn'}">${x.taken?'Sudah diambil':'Belum diambil'}</span></div><div class="v">${money(x.amount)}<small>admin ${money(x.fee||0)}</small></div></div>`).join(''):'<div class="empty">Belum ada titipan.</div>'}</div></section>`}
  if(t==='transaksi')o+=txSection(R);
  return o}
AFTER.db=()=>{if(SUB.dbTab==='gudang'&&SUB.gdTab==='transaksi'&&AFTER.home)AFTER.home()};
</script>
